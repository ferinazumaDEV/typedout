name: tests

# Runs the suite on every Python version the package claims to support, so the
# claim in pyproject.toml is checked rather than asserted. Before this workflow
# existed the 100 tests only ever ran on the author's machine, on one version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one version failing must not hide the others
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

      - name: Run the README's own example
        # The quickstart is the first thing a reader executes. If it breaks,
        # the README is wrong, and that is worth failing the build for.
        run: python examples/quickstart.py

  extras:
    # The optional provider extras pull real SDKs. They are not exercised by the
    # suite (which uses the offline MockProvider), so this job checks only that
    # the dependency ranges still resolve and the package imports with them
    # installed — no API key, no network call to any provider.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [anthropic, openai]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"    # the declared floor: the version most likely to break

      - name: Install with the ${{ matrix.extra }} extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"

      - name: Import the package and the provider
        run: |
          python -c "import typedout; print(typedout.__version__)"
          python -c "from typedout import ${{ matrix.extra == 'anthropic' && 'AnthropicProvider' || 'OpenAIProvider' }} as P; print(P.__name__)"
