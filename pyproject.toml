[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typedout-py"
version = "0.1.1"
description = "Reliable structured output from OpenAI and Anthropic — schema-validated JSON with tolerant repair and error-aware retries, with a provider interface for others."
readme = "README.md"
# 3.10 is the floor because anthropic 1.x requires it, and no lower: a floor is a
# minimum, not a recommendation. Python 3.9 reached end of life on 2025-10-31.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Aporta Franco", email = "ferinazumaDEV@users.noreply.github.com" }]
keywords = [
    "llm",
    "structured-output",
    "json",
    "pydantic",
    "json-schema",
    "anthropic",
    "openai",
    "function-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# Capped at the major: anthropic 1.x removed `temperature` from messages.create,
# and an uncapped range would let a future 2.x break this package silently.
anthropic = ["anthropic>=1,<2"]
openai = ["openai>=1.30,<2"]
dev = ["pytest>=7,<9"]

[project.urls]
Homepage = "https://github.com/ferinazumaDEV/typedout"
Source = "https://github.com/ferinazumaDEV/typedout"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typedout = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
